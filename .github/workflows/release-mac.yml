name: Release macOS

# Production path: push a matching version tag (v0.1.5 with package.json 0.1.5).
# Smoke path: workflow_dispatch builds, signs, notarizes, and uploads Actions
# artifacts only — it never creates a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # node-gyp 9 prefers Homebrew Python 3.14 on macos-latest unless forced.
      # Pin Python 3.11, restore distutils via setuptools, then force node-gyp.
      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore distutils and force Python 3.11 for node-gyp
        run: |
          PYTHON_311="$(which python)"
          "$PYTHON_311" --version
          "$PYTHON_311" -m pip install --upgrade setuptools
          "$PYTHON_311" -c "import distutils; print(distutils.__file__)"
          echo "PYTHON=${PYTHON_311}" >> "$GITHUB_ENV"
          echo "npm_config_python=${PYTHON_311}" >> "$GITHUB_ENV"
          echo "NODE_GYP_FORCE_PYTHON=${PYTHON_311}" >> "$GITHUB_ENV"

      - name: Show Python used for native builds
        run: |
          echo "PYTHON=$PYTHON"
          echo "npm_config_python=$npm_config_python"
          echo "NODE_GYP_FORCE_PYTHON=$NODE_GYP_FORCE_PYTHON"
          "$NODE_GYP_FORCE_PYTHON" --version

      - name: Install dependencies
        run: npm ci

      - name: Validate packaged FoxBridge Cloud public configuration
        env:
          FOXBRIDGE_CLOUD_URL: ${{ vars.FOXBRIDGE_CLOUD_URL }}
          FOXBRIDGE_CLOUD_PUBLISHABLE_KEY: ${{ vars.FOXBRIDGE_CLOUD_PUBLISHABLE_KEY }}
          FOXBRIDGE_SCANNER_URL: ${{ vars.FOXBRIDGE_SCANNER_URL }}
        run: npm run validate:packaged-cloud-env

      - name: Run TypeScript check and app build
        env:
          FOXBRIDGE_CLOUD_URL: ${{ vars.FOXBRIDGE_CLOUD_URL }}
          FOXBRIDGE_CLOUD_PUBLISHABLE_KEY: ${{ vars.FOXBRIDGE_CLOUD_PUBLISHABLE_KEY }}
          FOXBRIDGE_SCANNER_URL: ${{ vars.FOXBRIDGE_SCANNER_URL }}
        run: npm run build

      - name: Verify compiled packaged Cloud defaults
        env:
          FOXBRIDGE_CLOUD_URL: ${{ vars.FOXBRIDGE_CLOUD_URL }}
          FOXBRIDGE_CLOUD_PUBLISHABLE_KEY: ${{ vars.FOXBRIDGE_CLOUD_PUBLISHABLE_KEY }}
          FOXBRIDGE_SCANNER_URL: ${{ vars.FOXBRIDGE_SCANNER_URL }}
        run: npm run verify:packaged-cloud-bundle

      - name: Run Mac release configuration tests
        run: npm run test:mac-release-config

      - name: Run packaged Cloud configuration tests
        run: npm run test:packaged-cloud-config

      - name: Run meal order tests
        run: npm run test:meal-order

      - name: Run payment tests
        run: npm run test:payment

      - name: Run badge name tests
        run: npm run test:badge-name

      - name: Run agriculture book tests
        run: npm run test:agriculture-book

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Confirm tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match package.json version ${VERSION} (expected v${VERSION})."
            exit 1
          fi
          echo "Tag ${TAG} matches package version. GitHub Release publish will run after local verification."

      - name: Require Apple signing and notarization secrets
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          if [ -z "$MAC_CSC_LINK" ]; then echo "Missing required GitHub Actions secret: MAC_CSC_LINK"; missing=1; fi
          if [ -z "$MAC_CSC_KEY_PASSWORD" ]; then echo "Missing required GitHub Actions secret: MAC_CSC_KEY_PASSWORD"; missing=1; fi
          if [ -z "$APPLE_ID" ]; then echo "Missing required GitHub Actions secret: APPLE_ID"; missing=1; fi
          if [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then echo "Missing required GitHub Actions secret: APPLE_APP_SPECIFIC_PASSWORD"; missing=1; fi
          if [ -z "$APPLE_TEAM_ID" ]; then echo "Missing required GitHub Actions secret: APPLE_TEAM_ID"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required signing and notarization secrets are present (values not logged)."

      - name: Build, sign, and notarize universal Mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # electron-builder must not publish. GitHub Release upload happens only
        # after local verification of the complete five-file asset set.
        # afterSign runs scripts/notarize-mac.cjs (submit once, then poll).
        run: npx electron-builder --mac --publish never -c.forceCodeSigning=true

      - name: Verify signed Mac artifacts
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_SIGNED: '1'
        run: bash scripts/verify-mac-release.sh

      - name: Publish complete Mac asset set to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-github-mac-release.sh

      - name: Upload Mac release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxBridge-${{ steps.version.outputs.version }}-mac-universal
          path: |
            release/FoxBridge-${{ steps.version.outputs.version }}-mac-universal.dmg
            release/FoxBridge-${{ steps.version.outputs.version }}-mac-universal.dmg.blockmap
            release/FoxBridge-${{ steps.version.outputs.version }}-mac-universal.zip
            release/FoxBridge-${{ steps.version.outputs.version }}-mac-universal.zip.blockmap
            release/latest-mac.yml
          retention-days: 14
          if-no-files-found: error

      - name: Clean temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/mac-csc.p12 "$RUNNER_TEMP"/build_certificate.p12
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.p8
          echo "Temporary certificate files removed from runner temp (if any existed)."
